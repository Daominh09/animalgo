services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever REDIS_URL is in .env — inside this network, Redis
      # is reachable by service name, not localhost.
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mobile:
    build: ./mobile
    ports:
      - "8081:8081"
    env_file:
      - ./mobile/.env
    environment:
      # Expo embeds this host in the QR code / dev server URL it prints.
      # Left as container-internal it'd be useless to your phone — set
      # HOST_LAN_IP in a .env file at the repo root (see README) to your
      # machine's actual LAN IP, e.g. `ipconfig getifaddr en0` on macOS.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:?set HOST_LAN_IP in a repo-root .env, see README}
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  mobile_node_modules:
